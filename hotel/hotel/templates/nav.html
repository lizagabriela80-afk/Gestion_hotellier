<nav class="bg-blue-700 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="{% url 'core:accueil' %}" class="text-xl font-bold">Mon Hôtel</a>

        <div class="flex items-center gap-6">
            <a href="{% url 'rooms:liste_chambres' %}" class="hover:text-blue-200">Chambres</a>

            {% if user.is_authenticated %}
                <a href="#" class="hover:text-blue-200">Mes réservations</a>
                <span class="text-blue-200">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="hover:text-blue-200">Déconnexion</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="hover:text-blue-200">Connexion</a>
            {% endif %}
        </div>
    </div>
</nav>
