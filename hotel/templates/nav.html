<nav class="bg-[#F7F3EC] outline-2 outline-white fixed top-0 left-0 w-full shadow items-center px-6 z-50 transition-shadow duration-300">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
 
        <a href="{% url 'core:accueil' %}" class="text-xl font-bold transition-colors duration-300 hover:text-[#B08D57]">
            Endrias Hotel
        </a>
 
        <!-- Bouton burger, visible seulement en dessous de md -->
        <button id="navToggle" class="md:hidden flex flex-col justify-center items-center gap-1.5 w-8 h-8" aria-label="Ouvrir le menu">
            <span id="barTop" class="block w-6 h-[1.5px] bg-[#1C1C1C] transition-transform duration-300"></span>
            <span id="barMid" class="block w-6 h-[1.5px] bg-[#1C1C1C] transition-opacity duration-300"></span>
            <span id="barBot" class="block w-6 h-[1.5px] bg-[#1C1C1C] transition-transform duration-300"></span>
        </button>
 
        <!-- Menu desktop, caché en dessous de md -->
        <div class="hidden md:flex items-center gap-10">
 
            <a href="{% url 'rooms:liste_chambres' %}"
                class="relative text-sm text-[#1C1C1C] no-underline py-1
                after:content-[''] after:absolute after:left-0 after:-bottom-0.5 after:w-0 after:h-[1.5px] after:bg-[#B08D57]
                after:transition-all after:duration-300 hover:after:w-full hover:text-[#B08D57] transition-colors duration-300">
                Chambres
            </a>
 
            {% if user.is_authenticated %}
            <a href="{% url 'booking:mes_reservations' %}"
                class="relative text-sm text-[#1C1C1C] no-underline py-1
                after:content-[''] after:absolute after:left-0 after:-bottom-0.5 after:w-0 after:h-[1.5px] after:bg-[#B08D57]
                after:transition-all after:duration-300 hover:after:w-full hover:text-[#B08D57] transition-colors duration-300">
                Mes réservations
            </a>
 
            <span class="text-sm text-[#B08D57] transition-transform duration-300 hover:scale-105 inline-block">{{ user.username }}</span>
 
            <form method="post" action="{% url 'logout' %}" style="display: inline; margin: 0;">
                {% csrf_token %}
                <button type="submit"
                    class="relative bg-none border-none text-[#1C1C1C] text-sm cursor-pointer p-0 font-inherit py-1
                    after:content-[''] after:absolute after:left-0 after:-bottom-0.5 after:w-0 after:h-[1.5px] after:bg-[#B08D57]
                    after:transition-all after:duration-300 hover:after:w-full hover:text-[#B08D57] transition-colors duration-300">
                    Déconnexion
                </button>
            </form>
            {% else %}
            <a href="{% url 'inscription' %}" class="text-sm no-underline py-2 px-5 border border-[#B08D57] rounded-sm text-[#1C1C1C]">Inscription</a>
            <a href="{% url 'login' %}" class="text-[#B08D57] no-underline text-sm py-2 px-5 border border-[#B08D57] rounded-sm">Connexion</a>
            {% endif %}
        </div>
    </div>
 
    <!-- Menu mobile déroulant, caché par défaut -->
    <div id="mobileMenu" class="md:hidden hidden flex-col gap-1 px-6 pb-4 border-t border-black/[0.06]">
 
        <a href="{% url 'rooms:liste_chambres' %}" class="text-sm text-[#1C1C1C] no-underline py-3 border-b border-black/[0.06]">
            Chambres
        </a>
 
        {% if user.is_authenticated %}
        <a href="{% url 'booking:mes_reservations' %}" class="text-sm text-[#1C1C1C] no-underline py-3 border-b border-black/[0.06]">
            Mes réservations
        </a>
 
        <span class="text-sm text-[#B08D57] py-3 border-b border-black/[0.06]">{{ user.username }}</span>
 
        <form method="post" action="{% url 'logout' %}" class="py-3">
            {% csrf_token %}
            <button type="submit" class="bg-none border-none text-[#1C1C1C] text-sm cursor-pointer p-0 font-inherit">
                Déconnexion
            </button>
        </form>
        {% else %}
        <a href="{% url 'inscription' %}" class="text-sm text-[#1C1C1C] no-underline py-3 border-b border-black/[0.06]">
            Inscription
        </a>
        <a href="{% url 'login' %}" class="text-[#B08D57] no-underline text-sm py-3">
            Connexion
        </a>
        {% endif %}
    </div>
</nav>
 
<script>
(function() {
    const toggle = document.getElementById('navToggle');
    const menu = document.getElementById('mobileMenu');
    const barTop = document.getElementById('barTop');
    const barMid = document.getElementById('barMid');
    const barBot = document.getElementById('barBot');
 
    toggle.addEventListener('click', function() {
        const isOpen = menu.classList.contains('flex');
 
        if (isOpen) {
            menu.classList.remove('flex');
            menu.classList.add('hidden');
            barTop.style.transform = 'none';
            barMid.style.opacity = '1';
            barBot.style.transform = 'none';
        } else {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            barTop.style.transform = 'translateY(6.5px) rotate(45deg)';
            barMid.style.opacity = '0';
            barBot.style.transform = 'translateY(-6.5px) rotate(-45deg)';
        }
    });
})();
</script>
