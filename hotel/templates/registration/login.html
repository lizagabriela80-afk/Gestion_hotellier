{% extends 'base.html' %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto; padding: 2rem; background: white; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08);">
    <h1 style="font-size: 24px; margin-bottom: 24px;">Connexion</h1>

    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
            <p style="color: #B5654A; font-size: 14px; margin-bottom: 16px;">
                Identifiant ou mot de passe incorrect.
            </p>
        {% endif %}

        <div style="margin-bottom: 16px;">
            <label for="{{ form.username.id_for_label }}" style="display: block; font-size: 14px; margin-bottom: 4px;">Nom d'utilisateur</label>
            {{ form.username }}
        </div>

        <div style="margin-bottom: 24px;">
            <label for="{{ form.password.id_for_label }}" style="display: block; font-size: 14px; margin-bottom: 4px;">Mot de passe</label>
            {{ form.password }}
        </div>

        <button type="submit" style="width: 100%; padding: 10px; background: #1C1C1C; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Se connecter
        </button>

        <input type="hidden" name="next" value="{{ next }}">
    </form>
</div>
{% endblock %}
